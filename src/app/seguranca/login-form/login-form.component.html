<div class="container" style="max-width: 400px; margin: auto">

  <form autocomplete="off">
    <div class="ui-g ui-fluid">

      <div class="ui-g-12">
        <h1>Login</h1>
      </div>

      <div class="ui-g-12">
        <input pInputText type="email" name="usuario" placeholder="E-mail"
          [(ngModel)]="usuario" required
          (keydown.enter)="usuario && senha && login()">
      </div>

      <div class="ui-g-12">
        <input pInputText type="password" name="senha" placeholder="Senha"
          [(ngModel)]="senha" required
          (keydown.enter)="usuario && senha && login()">
      </div>

      <div class="ui-g-12">
        <button pButton type="button" label="Login"
          [disabled]="!usuario || !senha"
          (click)="login()"></button>
      </div>

    </div>
  </form>

</div>
