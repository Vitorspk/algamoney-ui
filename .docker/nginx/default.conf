server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Logs
    access_log /var/log/nginx/algamoney-access.log;
    error_log /var/log/nginx/algamoney-error.log;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    # WARNING: unsafe-inline/unsafe-eval aumentam risco de XSS
    # TODO: Implementar nonce-based CSP quando migrar Chart.js para versão compatível
    # Para produção, considere usar hash-based CSP ou migrar para bibliotecas CSP-friendly
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:8080 https://*.algamoney.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    # Cache para assets estáticos - DESABILITADO PARA DESENVOLVIMENTO
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Cache para imagens e fontes (pode manter cache)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Arquivos JSON (configs)
    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML - sem cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Proxy para API (se necessário)
    # Descomente e configure se quiser fazer proxy para o backend
    # location /api {
    #     proxy_pass http://backend:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # Angular routing - todas as rotas devem servir o index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # CORS dinâmico - apenas domínios autorizados
        # SECURITY: Wildcard removido - apenas origens específicas permitidas
        set $cors_origin "";
        if ($http_origin ~* ^https?://(localhost:4200|localhost:8080|.*\.algamoney\.com)$) {
            set $cors_origin $http_origin;
        }

        # Para desenvolvimento local SEM origin header, permitir apenas se necessário
        # Em produção, essa linha DEVE ser removida
        if ($cors_origin = "") {
            set $cors_origin "http://localhost:4200";
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Negar acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
